name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm icons
      - run: pnpm build:web
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm exec playwright install chromium
      - run: pnpm test
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Native WebView2 integration
        shell: pwsh
        run: |
          $vite = Start-Process -FilePath node -ArgumentList 'node_modules/vite/bin/vite.js' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $null = Invoke-WebRequest 'http://127.0.0.1:5175/tests/fixtures/tauri-main.html'
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Vite did not start' }
            pnpm test:native
            if ($LASTEXITCODE -ne 0) { throw 'Native integration failed' }
          } finally {
            Stop-Process -Id $vite.Id -ErrorAction SilentlyContinue
          }
      - run: pnpm build --no-bundle
