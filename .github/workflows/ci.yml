name: CI
on:
  push:
    branches: [release, main, master]
  pull_request:
    branches: [release, main, master]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm desktop:compile
      - run: pnpm build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm exec playwright install chromium
      - run: pnpm test:ui
      - name: Native desktop integration
        shell: pwsh
        run: |
          $vite = Start-Process node -ArgumentList 'node_modules/vite/bin/vite.js' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try { $null = Invoke-WebRequest 'http://127.0.0.1:5173'; $ready = $true; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Vite did not start' }
            pnpm test:desktop
            if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          } finally { Stop-Process -Id $vite.Id -ErrorAction SilentlyContinue }
      - run: pnpm desktop:build --no-bundle
