appId: com.ai-tool-box.app
productName: AI Tool Box
copyright: Copyright © 2026 AI Tool Box

directories:
  output: ../ai-tool-box-release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraMetadata:
  main: dist-electron/main.mjs

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: icon.ico
  signAndEditExecutable: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: icon_1024.png

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: false

publish: null
